# 和风天气局域网中继 —— Docker 版
#
# 2026-10-02 在用户的飞牛 NAS 上盘完现状后定的方案：
#   · 那台 NAS 上已有 3 个容器（devnet-homekit / lucky / homebox），全是 compose 管的；
#     devnet-homekit 跟这个中继是同一种"小助手"角色 → 加第四个最顺手
#   · 那台 NAS **没有免密 sudo** → systemd 那条路每步都要输密码；docker 对 cyrus 可直用
#   · 资源完全够（15GB 内存空闲 11GB、数据盘空闲 12TB）→ 容器多吃的 ~10MB 是噪声
#   （纯论资源 systemd 更省：一个进程、磁盘 0。见同目录 wx-relay.service）
#
# 目录就照 NAS 上现有的习惯放：/vol1/1000/docker/wx-relay/
# 用法（在 NAS 上，cyrus 身份）：
#   1) mkdir -p /vol1/1000/docker/wx-relay && cd $_
#   2) 把 wx-relay.py、wx-compare.py、ed25519-private.pem 拷进来（chmod 600 私钥）
#   3) 把 wx-relay.env.example 复制成 .env 并改好（chmod 600 .env）
#   4) docker compose up -d && docker compose logs -f
#      （或者 fnOS 的「Docker → 项目 → 新建」把这份 compose 粘进去）

services:
  wx-relay:
    image: python:3.12-slim
    container_name: wx-relay
    restart: unless-stopped
    command: ["python3", "-u", "/app/wx-relay.py"]   # -u：日志不缓冲，docker logs 实时能看到
    working_dir: /app
    env_file: ./.env
    volumes:
      - ./:/app:ro                  # 脚本 + 私钥都在这个目录里（私钥 chmod 600）
    ports:
      - "8788:8788"                 # ESP32 的 WX_RELAY_URL 用这个端口
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    read_only: true                 # 容器里不需要写任何东西
    tmpfs:
      - /tmp
